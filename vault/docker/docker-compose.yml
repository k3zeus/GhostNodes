##
# ╔══════════════════════════════════════════════════════════════╗
# ║   GhostNodes — Module: Vault (Vaultwarden)                   ║
# ║   SSH Key Gateway + Password Manager                         ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Network: joins external 'ghostnet' for Nginx/Cloudflared routing
# Access: Internal via Nginx (port 8812) | External via Cloudflare Tunnel
#

services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    environment:
      - SIGNUPS_ALLOWED=${VW_SIGNUPS:-false}
      - ADMIN_TOKEN=${VW_ADMIN_TOKEN}
      - DOMAIN=${VW_DOMAIN:-https://vault.ghostnode.local}
      - WEBSOCKET_ENABLED=true
      - LOG_FILE=/data/vaultwarden.log
      - LOG_LEVEL=warn
      - SENDS_ALLOWED=true
      - EMERGENCY_ACCESS_ALLOWED=true
      - ORG_CREATION_USERS=all
    volumes:
      - ${VW_DATA_DIR:-./vw-data}:/data
    expose:
      - "80"
      - "3012"
    networks:
      - ghostnet
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  ghostnet:
    external: true
