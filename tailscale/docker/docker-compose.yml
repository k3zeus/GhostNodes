##
# ╔══════════════════════════════════════════════════════════════╗
# ║   GhostNodes — Module: Tailscale (Mesh VPN)                 ║
# ║   Subnet Router — Exposes all GhostNode services            ║
# ╚══════════════════════════════════════════════════════════════╝
#
# Runs in host network mode to advertise local subnets.
# After starting, approve routes in Tailscale Admin Console:
#   https://login.tailscale.com/admin/machines
#

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ghostnode-tailscale
    hostname: ghostnode
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY:-}
      - TS_ROUTES=${TS_ROUTES:-10.21.21.0/24,172.17.0.0/16}
      - TS_EXTRA_ARGS=${TS_EXTRA_ARGS:---accept-routes --advertise-tags=tag:ghostnode}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    network_mode: host

volumes:
  tailscale_state:
