# ══════════════════════════════════════════════════════════════
#  GhostNodes — Nginx Reverse Proxy: Nostr Relay
# ══════════════════════════════════════════════════════════════
#
# Access: wss://nostr.ghostnode.local (Tailscale/LAN)
# WebSocket-only service — requires Upgrade headers
#

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nostr_backend {
    zone nostr 64k;
    server ghostnode-nostr:8080;
}

server {
    listen 8814 ssl;
    server_name nostr.ghostnode.local;

    ssl_certificate     /etc/nginx/ssl/ghostnode.crt;
    ssl_certificate_key /etc/nginx/ssl/ghostnode.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── NIP-11 Relay Information ──
    # Responds to HTTP requests with relay metadata
    location / {
        proxy_pass http://nostr_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ── WebSocket Upgrade ──
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_http_version 1.1;

        # ── Timeouts for long-lived WebSocket connections ──
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
    }
}
