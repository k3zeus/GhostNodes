# ══════════════════════════════════════════════════════════════
#  GhostNodes — Nginx Reverse Proxy: Vaultwarden
# ══════════════════════════════════════════════════════════════
#
# Access: https://vault.ghostnode.local (Tailscale/LAN)
# Cloudflare Tunnel handles external SSL automatically.
# This config provides internal HTTPS via self-signed cert.
#

upstream vaultwarden_backend {
    zone vaultwarden 64k;
    server vaultwarden:80;
}

upstream vaultwarden_ws {
    zone vaultwarden_ws 64k;
    server vaultwarden:3012;
}

server {
    listen 8812 ssl;
    server_name vault.ghostnode.local;

    # ── SSL (self-signed — generate with install script) ──
    ssl_certificate     /etc/nginx/ssl/ghostnode.crt;
    ssl_certificate_key /etc/nginx/ssl/ghostnode.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Main Proxy ──
    location / {
        proxy_pass http://vaultwarden_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSocket for live sync ──
    location /notifications/hub {
        proxy_pass http://vaultwarden_ws;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /notifications/hub/negotiate {
        proxy_pass http://vaultwarden_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
