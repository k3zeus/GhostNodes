# ══════════════════════════════════════════════════════════════
#  GhostNodes — Nginx Reverse Proxy: Hermes (Open WebUI)
# ══════════════════════════════════════════════════════════════
#
# Access: https://hermes.ghostnode.local (Tailscale/LAN)
#

upstream hermes_backend {
    zone hermes 64k;
    server hermes-webui:8080;
}

server {
    listen 8813 ssl;
    server_name hermes.ghostnode.local;

    ssl_certificate     /etc/nginx/ssl/ghostnode.crt;
    ssl_certificate_key /etc/nginx/ssl/ghostnode.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ── Security Headers ──
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # ── Increased limits for file uploads ──
    client_max_body_size 50M;

    location / {
        proxy_pass http://hermes_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Open WebUI uses SSE/WS for streaming)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_http_version 1.1;

        # Increased timeouts for LLM responses
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
    }
}
